# =============================================================================
# Ressource Databricks App
# =============================================================================
# Le code déployé est le contenu de ../app, bundle React compilé compris. Le
# script scripts/build_frontend.sh DOIT avoir été exécuté avant le déploiement :
# sans app/server/static, l'API répond mais l'interface est absente.
#
# ⚠️ RESSOURCE LAKEBASE — la clé compte
# -----------------------------------------------------------------------------
# Deux générations de Lakebase coexistent, avec deux clés de ressource :
#
#   • `database` + instance_name/database_name → génération « database instance »,
#     DÉPRÉCIÉE. L'utiliser sur un projet Lakebase échoue au déploiement avec
#     « Database instance <nom> does not exist » (404), même si le projet existe.
#
#   • `postgres` + branch/database → génération « projects / branches /
#     endpoints », celle des projets Lakebase actuels. Les deux valeurs sont des
#     CHEMINS DE RESSOURCE COMPLETS, pas des noms courts :
#         projects/<PROJET>/branches/<BRANCHE>
#         projects/<PROJET>/branches/<BRANCHE>/databases/<BASE>
#     Les relever avec `databricks postgres list-branches` et `list-databases` —
#     le nom de la base est souvent tirété (« databricks-postgres »).
#
# Si `databricks bundle validate` rejette la clé `postgres` (le schéma DAB est
# parfois en retard sur l'API Lakebase), voir la variable `attacher_lakebase` :
# la mettre à `false`, déployer, puis attacher la ressource par
# `databricks apps create-update` — procédure détaillée dans docs/DEPLOIEMENT.md.
# =============================================================================

resources:
  apps:
    backflush_analytics:
      name: "backflush-analytics-${bundle.target}"
      description: >-
        Reporting et analytique des écarts de consommation composant issus du
        backflush de production.
      source_code_path: ../app

      resources:
        - name: postgres
          description: Projet Lakebase hébergeant le schéma backflush.
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database_path}
            permission: CAN_CONNECT_AND_CREATE

        - name: serving-endpoint
          description: Modèle de fondation utilisé par l'assistant IA.
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
