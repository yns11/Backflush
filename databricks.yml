# =============================================================================
# Bundle Databricks — écarts de consommation backflush
# =============================================================================
# Trois cibles : dev (isolée par utilisateur), preprod, prod.
#
#   databricks bundle validate -t dev   --profile <PROFIL>
#   databricks bundle deploy   -t dev   --profile <PROFIL>
#   databricks bundle run backflush_gold -t dev --profile <PROFIL>
#
# ⚠️ Avant tout déploiement de l'application, construire le bundle frontend :
#     ./scripts/build_frontend.sh
# =============================================================================

bundle:
  name: backflush_analytics

# =============================================================================
# Synchronisation des fichiers
# =============================================================================
# ⚠️ Par défaut, un bundle EXCLUT de la synchronisation tout ce que `.gitignore`
# ignore. Or `app/server/static/` y figure : c'est un artefact de build, qui n'a
# rien à faire dans l'historique Git.
#
# Sans la ré-inclusion ci-dessous, le déploiement réussit, l'application démarre,
# l'API répond… et l'interface est absente. Panne silencieuse : rien n'échoue,
# il ne manque « que » le frontend.
#
# La contrepartie est que le bundle compilé doit exister au moment du
# déploiement. `bundle deploy` ne le vérifie pas : utilisez `scripts/deploy.sh`,
# qui compile puis déploie, plutôt que d'enchaîner les commandes à la main.
# =============================================================================
sync:
  include:
    - app/server/static/**

variables:
  catalog:
    description: Catalogue Unity Catalog du modèle gold.
    default: emotors_data_champions
  schema:
    description: Schéma gold.
    default: backflush
  bronze_catalog:
    description: Catalogue des tables ERP brutes.
    default: emotors_data_platform
  bronze_schema:
    default: bronze_erp
  silver_catalog:
    default: emotors_data_champions
  silver_schema:
    default: silver_erp_ye
  date_from:
    description: Début de l'historique analysé (AAAA-MM-JJ).
    default: "2026-03-30"
  seuil_conformite:
    description: Tolérance en unités au-delà de laquelle une ligne n'est plus conforme.
    default: "0.5"
  company_predicate:
    description: >-
      Filtre société D365 appliqué aux vues source. Paramètre d'exploitation,
      jamais alimenté par une saisie utilisateur.
    default: "1 = 1"

  lakebase_host:
    description: Hôte de l'instance Lakebase (endpoint.status.hosts.host).
    default: ""
  lakebase_database:
    default: databricks_postgres
  lakebase_endpoint:
    description: projects/<id>/branches/<branche>/endpoints/<endpoint>
    default: ""
  lakebase_pg_schema:
    default: backflush

  # --- Ressource « postgres » de l'application ------------------------------
  # Chemins de ressource COMPLETS, pas des noms courts. Les relever avec :
  #   databricks postgres list-branches  <PROJET> --profile <PROFIL>
  #   databricks postgres list-databases <PROJET> <BRANCHE> --profile <PROFIL>
  lakebase_branch:
    description: projects/<PROJET>/branches/<BRANCHE>
    default: ""
  lakebase_database_path:
    description: projects/<PROJET>/branches/<BRANCHE>/databases/<BASE>
    default: ""

  llm_endpoint:
    description: Endpoint de serving utilisé par l'assistant IA.
    default: databricks-claude-opus-4-8
  app_service_principal:
    description: >-
      Rôle Postgres du principal de service de l'application, qui reçoit SELECT
      après chaque bascule de table. En général le client_id de l'application.
      Laissée vide, aucun GRANT n'est émis (le job le signale) : les droits sont
      alors à accorder à la main après chaque exécution — voir DEPLOIEMENT.md §5.
      ⚠️ Propre à chaque cible : l'application se nomme
      « backflush-analytics-${bundle.target} », donc dev, preprod et prod ont
      trois principaux de service distincts. La valeur se déclare dans le bloc
      `targets`, pas ici — ce défaut vide n'est qu'un garde-fou.
    default: ""

  notification_email:
    description: Destinataire des alertes d'échec de job.
    default: ""

  schedule_pause_status:
    description: >-
      PAUSED ou UNPAUSED. En développement, la planification est suspendue par
      défaut : une copie de travail ne doit pas réécrire un schéma partagé toutes
      les nuits.
    default: PAUSED

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      # client_id du principal de service de « backflush-analytics-dev ».
      # Ce n'est pas un secret — un identifiant, jamais une clé — mais il est
      # propre à cette cible : preprod et prod portent d'autres applications,
      # donc d'autres principaux. Le relever avec :
      #   databricks apps get backflush-analytics-<cible> -o json \
      #     | jq -r '.service_principal_client_id'
      app_service_principal: "65abe779-9d6a-4f89-95aa-ad394d85389e"

  preprod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: backflush_preprod
      lakebase_pg_schema: backflush_preprod
      schedule_pause_status: UNPAUSED

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schedule_pause_status: UNPAUSED
    permissions:
      - level: CAN_VIEW
        group_name: users
